name: Azure SOC CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - "ai-soc-triage-agent/**"
      - "azure-enrichment-engine/**"
      - "terraform-azure-soc/**"
      - ".github/workflows/azure-soc-cicd.yml"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  GHCR_REGISTRY: ghcr.io
  GHCR_OWNER: koatedevopskpai
  IMAGE_TRIAGE: azure-ai-soc-triage/ai-soc-triage-agent
  IMAGE_ENRICH: azure-ai-soc-triage/azure-enrichment-engine

jobs:
  test-ai-triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        working-directory: ai-soc-triage-agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests (mock mode, no cloud spend)
        working-directory: ai-soc-triage-agent
        run: pytest test_app.py -q

  build-and-push-images:
    runs-on: ubuntu-latest
    needs: test-ai-triage
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ env.GHCR_OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push AI triage image
        uses: docker/build-push-action@v5
        with:
          context: ai-soc-triage-agent
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/${{ env.IMAGE_TRIAGE }}:latest
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/${{ env.IMAGE_TRIAGE }}:${{ github.sha }}

      - name: Build and push enrichment image
        uses: docker/build-push-action@v5
        with:
          context: azure-enrichment-engine
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/${{ env.IMAGE_ENRICH }}:latest
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/${{ env.IMAGE_ENRICH }}:${{ github.sha }}

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        working-directory: terraform-azure-soc
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform-azure-soc
        run: terraform validate
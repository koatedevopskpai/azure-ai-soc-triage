name: Azure SOC CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - "azure-enrichment-engine/**"
      - "terraform-azure-soc/**"
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: func-soc-enrich-mvp
  AZURE_RESOURCE_GROUP: rg-ai-soc-mvp
  PYTHON_VERSION: "3.11"

jobs:
  test-ai-triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        working-directory: ai-soc-triage-agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests (mock mode, no cloud spend)
        working-directory: ai-soc-triage-agent
        run: pytest test_app.py -q

  build-and-deploy-function:
    runs-on: ubuntu-latest
    needs: test-ai-triage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Function dependencies
        working-directory: azure-enrichment-engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          zip -r ../function.zip .

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Function App
        run: |
          az functionapp deployment source config-zip \
            --name $AZURE_FUNCTIONAPP_NAME \
            --resource-group $AZURE_RESOURCE_GROUP \
            --src azure-enrichment-engine/function.zip

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        working-directory: terraform-azure-soc
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform-azure-soc
        run: terraform validate